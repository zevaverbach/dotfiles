set-option -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g mouse on
# Detect system theme on startup and set initial pane border accordingly
if-shell 'defaults read -g AppleInterfaceStyle &>/dev/null' \
    'set -g pane-border-style fg=black' \
    'set -g pane-border-style fg=colour248'

set -g @sessionx-bind 's'
bind l select-pane -t :.+
bind h select-pane -t :.-
bind C-l split-window -h -p 33 -c "#{pane_current_path}"

unbind-key -T copy-mode-vi v

setw -g mode-keys vi
bind -T copy-mode-vi 'r' send -X rectangle-toggle  # Begin selection in copy mode.
bind -T copy-mode-vi 'v' send -X begin-selection     # Begin selection in copy mode.
bind -T copy-mode-vi 'y' send -X copy-selection      # Yank selection in copy mode.
bind P paste-buffer
bind -T root C-c if-shell -F '#{==:#{pane_mode},tree-mode}' 'send-keys Escape' 'send-keys C-c'
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

set -sg escape-time 10
set -g focus-events on
set -g default-terminal "screen-256color"
set -ga terminal-overrides ',xterm-256color:Tc'
set -g history-limit 30000
set-window-option -g aggressive-resize
# set -ag pane-active-border fg=magenta

set -g status on
set -g status-left ""
# Show current task in status bar
set -g status-left "#(~/.tmux/get_git_branch.sh #{pane_current_path})"
set -g status-left-length 150
set -g status-right "#{session_name}#{?@llm_window_name, | #{@llm_window_name},}#(~/.tmux/llm_window_tick.sh)"
# Detect system theme on startup and set initial theme accordingly
if-shell 'defaults read -g AppleInterfaceStyle &>/dev/null' \
    'set -g status-style bg=colour17,fg=colour248' \
    'set -g status-style bg=colour254,fg=colour237'

set -g window-status-format ""
set -g window-status-current-format ""
set -g status-interval 1
set -g status-position bottom
set -g status-right-length 80
set -g display-time 200
set -g message-style bg=default,fg=default

# LLM-driven window renaming (Claude Haiku recommended)
set -g automatic-rename off
set -g allow-rename off
set -g @llm-rename-enabled on
set -g @llm-rename-model "claude-3-5-haiku-20241022"
set -g @llm-rename-openai-model "gpt-4o-mini"
set -g @llm-rename-interval 45
set -g @llm-rename-lines 120
set -g @llm-rename-timeout 8
set -g @llm-rename-tick-interval 12
set-hook -g after-new-window "run-shell -b '~/.tmux/llm_window_name.sh #{pane_id}'"
set-hook -g after-split-window "run-shell -b '~/.tmux/llm_window_name.sh #{pane_id}'"
set-hook -g pane-focus-in "run-shell -b '~/.tmux/llm_window_name.sh #{pane_id}'"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'erikw/tmux-dark-notify'

# Configure tmux-dark-notify to use custom theme files
set -g @dark-notify-theme-path-light '~/.tmux/tmux-light.conf'
set -g @dark-notify-theme-path-dark '~/.tmux/tmux-dark.conf'

run '~/.tmux/plugins/tpm/tpm'
